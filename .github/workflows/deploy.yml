name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.11.2"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="device_cert_arn=${{ secrets.DEVICE_CERT_ARN }}" \
            -var="acm_cert_arn=${{ secrets.ACM_CERT_ARN }}" \
            -var="dashboard_acm_cert_arn=${{ secrets.DASHBOARD_ACM_CERT_ARN }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}" \
            2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...[truncated]' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="device_cert_arn=${{ secrets.DEVICE_CERT_ARN }}" \
            -var="acm_cert_arn=${{ secrets.ACM_CERT_ARN }}" \
            -var="dashboard_acm_cert_arn=${{ secrets.DASHBOARD_ACM_CERT_ARN }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}"

  lambda-deploy:
    name: Lambda Deploy
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Lambda changes
        id: lambda_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^lambda/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.lambda_changed.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy TelemetryHandler
        if: steps.lambda_changed.outputs.changed == 'true'
        run: |
          zip -j telemetry.zip lambda/telemetry_handler.py
          aws lambda update-function-code \
            --function-name IoTTelemetryHandler \
            --zip-file fileb://telemetry.zip

      - name: Package and deploy CommandRelay
        if: steps.lambda_changed.outputs.changed == 'true'
        run: |
          zip -j command.zip lambda/command_relay.py
          aws lambda update-function-code \
            --function-name IoTCommandRelay \
            --zip-file fileb://command.zip

      - name: Package and deploy TelemetryQuery
        if: steps.lambda_changed.outputs.changed == 'true'
        run: |
          zip -j query.zip lambda/telemetry_query.py
          aws lambda update-function-code \
            --function-name IoTTelemetryQuery \
            --zip-file fileb://query.zip

  dashboard-deploy:
    name: Dashboard Deploy
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Upload dashboard
        working-directory: infra
        run: |
          terraform init
          API_KEY=$(terraform output -raw dashboard_api_key)
          API_URL=$(terraform output -raw telemetry_api_url)
          CMD_URL="${API_URL/%\/telemetry/\/command}"

          # Inject credentials into HTML template at deploy time (never committed)
          sed -e "s|__API_KEY__|${API_KEY}|g" \
              -e "s|__TELEMETRY_API_URL__|${API_URL}|g" \
              -e "s|__COMMAND_API_URL__|${CMD_URL}|g" \
              ../demo/index.html > /tmp/index-deploy.html

          aws s3 cp /tmp/index-deploy.html "s3://$(terraform output -raw dashboard_bucket)/index.html" \
            --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw dashboard_cloudfront_distribution_id)" \
            --paths '/index.html'
